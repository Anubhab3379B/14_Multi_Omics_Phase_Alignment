# Data paths are intentionally local placeholders.
raw_dir: data/raw
interim_dir: data/interim
processed_dir: data/processed

# Synthetic defaults keep the foundation runnable before real datasets arrive.
modalities:
  rna:
    feature_count: 128
  atac:
    feature_count: 96
  protein:
    feature_count: 48

time:
  field: time
  synthetic_samples: 120

# Phase 2 file-backed format. Paths are examples, not committed datasets.
file_backed:
  sample_id_column: sample_id
  time_column: time
  phase_column: true_phase
  metadata_csv: data/raw/metadata.csv
  rna_csv: data/raw/rna.csv
  atac_csv: data/raw/atac.csv
  protein_csv: data/raw/protein.csv
  processed_npz: data/processed/aligned_batch.npz
